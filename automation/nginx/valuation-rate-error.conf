# Include once in each server that uses valuation-rate-location.conf.
location @valuation_rate_limited {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "30" always;
    add_header Access-Control-Allow-Origin "*" always;
    return 429 '{"success":false,"error":{"code":"RATE_LIMITED","message":"Too many requests; retry shortly"}}';
}
