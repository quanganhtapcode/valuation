# Include inside each HTTP location that proxies valuation REST requests.
# Vercel and Cloudflare can share a peer address between many visitors, so this
# is deliberately a coarse origin-protection limit, not a per-user quota.
limit_req zone=valuation_api_peer burst=200 nodelay;
limit_req_status 429;
error_page 429 = @valuation_rate_limited;
